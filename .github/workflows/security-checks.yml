name: Security checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
